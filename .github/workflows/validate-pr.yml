name: Validate Data PR

on:
  pull_request:
    branches: [ v3 ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          fetch-depth: 2

      - name: Run validation script and capture output
        id: validation
        if: steps.changed-files.outputs.all_changed_files != ''
        continue-on-error: true
        run: |
          echo "Validating files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"
          
          output_file=$(mktemp)
          
          if ! bash scripts/validate.sh ${{ steps.changed-files.outputs.all_changed_files }} &> "$output_file"; then
            echo "Validation script failed. Setting exit code to 1."
            exit_code=1
          else
            echo "Validation script succeeded."
            exit_code=0
          fi
          
          validation_content=$(cat "$output_file")
          rm "$output_file"
          
          echo "validation_output<<EOF" >> $GITHUB_OUTPUT
          echo "$validation_content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          exit $exit_code

      - name: Post or update failure comment
        if: steps.validation.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const output = `${{ steps.validation.outputs.validation_output }}`;
            
            const body = `**Validation Failed**

            The automatic data validation for this Pull Request has failed. Please review the errors below and push your corrections to this branch to re-run the check
            
            <details>
            <summary>Click to view validation errors</summary>
            
            \`\`\`
            ${output || 'No output was captured from the validation script'}
            \`\`\`
            
            </details>
            
            ---
            *If you believe this is an error with the validation script itself, please contact @biase-d*
            `;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('**Validation Failed**')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
              console.log(`Updated existing validation comment #${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
              console.log('Posted a new validation failure comment');
            }
